services:
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: pockity-server
    env_file:
      - Server/.env
    ports:
      - "8080:8080"
    restart: always
    volumes:
      - ./Server:/app
    command: ["npm", "run", "dev"]

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: pockity-frontend
    env_file:
      - Frontend/.env
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "run", "dev"]

  postgres:
    image: postgres:15
    container_name: pockity-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pockity_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
